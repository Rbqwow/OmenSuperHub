name: CI Build

'on':
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build OmenSuperHub (x64 Release)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore OmenSuperHub.sln

      - name: Build solution
        run: msbuild OmenSuperHub.sln /p:Configuration=Release /p:Platform=x64 /m /verbosity:minimal

      - name: Package artifacts
        shell: pwsh
        run: |
          $releaseDir = "bin/x64/Release"
          $exePath = Join-Path $releaseDir "OmenSuperHub.exe"

          if (-not (Test-Path $exePath)) {
            Write-Error "OmenSuperHub.exe not found in $releaseDir"
            exit 1
          }

          Compress-Archive -Path $exePath -DestinationPath "OmenSuperHub-x64.zip" -Force
          Write-Host "Successfully packaged OmenSuperHub-x64.zip with OmenSuperHub.exe"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OmenSuperHub-x64
          path: OmenSuperHub-x64.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OmenSuperHub-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
